services:
  db:
    image: pgvector/pgvector:0.8.2-pg17
    container_name: fleetmind-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: fleetmind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fleetmind

    ports:
      - '127.0.0.1:5433:5432'

    volumes:
      - fleetmind_pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fleetmind -d fleetmind']
      interval: 5s
      timeout: 5s
      retries: 10

  broker:
    image: redpandadata/redpanda:v25.3.11
    profiles: [telemetry]
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=768M
      - --reserve-memory=0M
      - --unsafe-bypass-fsync=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://broker:9092,external://127.0.0.1:${FLEETMIND_KAFKA_PORT:-19092}
      - --set
      - redpanda.auto_create_topics_enabled=false
      - --set
      - redpanda.write_caching_default=false
    mem_limit: 1g
    ports:
      - '127.0.0.1:${FLEETMIND_KAFKA_PORT:-19092}:19092'
    volumes:
      - fleetmind_brokerdata:/var/lib/redpanda/data
    healthcheck:
      test: ['CMD', 'rpk', 'cluster', 'info', '-X', 'brokers=127.0.0.1:9092']
      interval: 5s
      timeout: 4s
      retries: 12

volumes:
  fleetmind_pgdata:
  fleetmind_brokerdata:
