global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: fleetmind-api
    scrape_timeout: 5s
    authorization:
      credentials_file: /run/secrets/fleetmind_scrape_token
    file_sd_configs:
      - files: [/etc/prometheus/targets/api.json]
        refresh_interval: 30s
  - job_name: fleetmind-worker
    scrape_timeout: 5s
    authorization:
      credentials_file: /run/secrets/fleetmind_scrape_token
    file_sd_configs:
      - files: [/etc/prometheus/targets/workers.json]
        refresh_interval: 30s
